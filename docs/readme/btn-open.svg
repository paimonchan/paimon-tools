<svg xmlns="http://www.w3.org/2000/svg" width="216" height="52" viewBox="0 0 216 52" fill="none">
  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e0a0"/>
      <stop offset="0.5" stop-color="#eec35a"/>
      <stop offset="1" stop-color="#d9911e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d9911e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- base with honey gradient -->
  <rect width="216" height="52" rx="13" fill="url(#honey)"/>
  <!-- top sheen for depth -->
  <rect width="216" height="52" rx="13" fill="url(#sheen)"/>
  <!-- inner highlight border -->
  <rect x="0.75" y="0.75" width="214.5" height="50.5" rx="12.25" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>
  <!-- play icon in soft chip -->
  <rect x="16" y="13" width="26" height="26" rx="8" fill="#1d1a16" fill-opacity="0.1"/>
  <path d="M25 19.5 L25 32.5 L34 26 Z" fill="#1d1a16"/>
  <!-- label -->
  <text x="118" y="33" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1a16" text-anchor="middle" letter-spacing="0.2">Open the App</text>
  <!-- arrow -->
  <path d="M190 26 L202 26 M197 21.5 L202 26 L197 30.5" stroke="#1d1a16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
